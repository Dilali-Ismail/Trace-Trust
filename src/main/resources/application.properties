spring.application.name=TraceAndTrust
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true

# Désactiver la config de sécurité par défaut par précaution
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/logistics-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs
# Mapping pour le nom d'utilisateur (souvent 'preferred_username' dans Keycloak)
spring.security.oauth2.resourceserver.jwt.principal-claim-name=preferred_username