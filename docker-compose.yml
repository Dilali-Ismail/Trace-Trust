services:

  db:
    image: postgres:15
    container_name: logistics-db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=logistics_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data


  api:
    container_name: logistics-api
    build: .
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/logistics_db
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - db
    volumes:
      - .:/api

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.0
    container_name: logistics-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: password
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    depends_on:
      - db
    volumes:
      - ./keycloak/logistics-realm.json:/opt/keycloak/data/import/realm.json


  pgadmin:
    image: dpage/pgadmin4
    container_name: logistics-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@logistics.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db


volumes:
  postgres-data:
  pgadmin-data: